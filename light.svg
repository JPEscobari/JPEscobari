        <text x="312" y="16" class="mono pill-txt">Node.js</text>

        <rect x="380" y="0" width="76" height="24" rx="6" fill="#CBD5E1" fill-opacity="0.7" stroke="#0369A1" stroke-width="0.8" />
        <circle cx="392" cy="12" r="3" fill="#0369A1" />
        <text x="402" y="16" class="mono pill-txt">Python</text>

        <rect x="464" y="0" width="76" height="24" rx="6" fill="#CBD5E1" fill-opacity="0.7" stroke="#047857" stroke-width="0.8" />
        <circle cx="476" cy="12" r="3" fill="#047857" />
        <text x="486" y="16" class="mono pill-txt">Django</text>

        <rect x="548" y="0" width="74" height="24" rx="6" fill="#CBD5E1" fill-opacity="0.7" stroke="#7E22CE" stroke-width="0.8" />
        <circle cx="560" cy="12" r="3" fill="#7E22CE" />
        <text x="570" y="16" class="mono pill-txt">OpenAI</text>
