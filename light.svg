    <text x="895" y="35" class="mono nav-txt">02.SYSTEM.INFO</text>
    <text x="1015" y="35" class="mono nav-txt">03.PROJECTS</text>
    <text x="1110" y="35" class="mono" font-size="11" fill="#0369A1">UTF-8</text>

    <!-- ========================================== -->
    <!-- LEFT COLUMN: VISUAL.MAP & BATTLESTATION    -->
