    <circle cx="180" cy="95" r="1.5" fill="#0891B2" opacity="0.4">
      <animate attributeName="cy" values="95;80;95" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="140" r="2" fill="#7E22CE" opacity="0.35">
