          <animate attributeName="opacity" values="1;1;0;0;0;0;0" keyTimes="0;0.3;0.33;0.63;0.66;0.96;1" dur="12s" repeatCount="indefinite" />
        </text>
        <text x="632" y="205" opacity="0">AI Integration Engineer (LLMs, OpenAI API, IBM Orchestrate)🔽
          <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.3;0.33;0.63;0.66;0.96;1" dur="12s" repeatCount="indefinite" />
        </text>
        <text x="632" y="205" opacity="0">M.S. in Computer Science (AI Concentration) 🔽
          <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.3;0.33;0.63;0.66;0.96;1" dur="12s" repeatCount="indefinite" />
        </text>
      </g>

      <!-- Balanced Telemetry Grid (Right-Aligned Labels, Left-Aligned Values) -->
