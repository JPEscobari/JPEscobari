      <text x="448" y="102" class="mono" font-size="10.5" fill="#64748B" text-anchor="end">[3:11 AM]</text>
      <line x1="44" y1="114" x2="452" y2="114" stroke="#CBD5E1" stroke-width="1" />

      <!-- My Battlestation Photo) -->
      <rect x="44" y="128" width="408" height="288" rx="10" fill="#F1F5F9" fill-opacity="0.75" stroke="#CBD5E1" stroke-width="1" />

      <g clip-path="url(#ascii-clip)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="6s" repeatCount="indefinite" />
          <g>
  <image href="./battlestation.jpg" x="54" y="130" width="408" height="280" preserveAspectRatio="xMidYMid slice" />
</g>
        </g>

        <!-- Subtle Animated Scanline -->
        <rect x="44" y="128" width="408" height="28" fill="url(#scanline-grad)">
          <animate attributeName="y" values="100;416;100" dur="7s" repeatCount="indefinite" />
        </rect>
      </g>

