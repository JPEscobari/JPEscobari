    <rect x="230" y="21" width="76" height="20" rx="4" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="0.8" />
    <circle cx="242" cy="31" r="3" fill="#059669">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="251" y="35" class="mono" font-size="10.5" fill="#047857" font-weight="700">ONLINE</text>

