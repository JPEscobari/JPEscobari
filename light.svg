        <text x="635" y="0" class="mono val">M.S. in Computer Science (AI) @ NSU Florida · B.S. Computer Networks</text>

        <text x="615" y="24" class="mono lbl">CERTIFICATIONS</text>
        <text x="635" y="24" class="mono val-em">AWS Certified Solutions Architect · GA Cert. Software Engineer</text>

