        <rect x="0" y="0" width="96" height="24" rx="6" fill="#CBD5E1" fill-opacity="0.7" stroke="#0369A1" stroke-width="0.8" />
        <circle cx="12" cy="12" r="3" fill="#0369A1" />
        <text x="22" y="16" class="mono pill-txt">TypeScript</text>

        <rect x="104" y="0" width="96" height="24" rx="6" fill="#CBD5E1" fill-opacity="0.7" stroke="#A16207" stroke-width="0.8" />
