        <text x="615" y="72" class="mono lbl">LANGUAGES IRL</text>
        <text x="635" y="72" class="mono val">English · Spanish</text>
      </g>

      <line x1="506" y1="328" x2="1132" y2="328" stroke="#CBD5E1" stroke-width="1" />

