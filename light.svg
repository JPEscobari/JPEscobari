<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Juan Pablo Escobari (JP) - Full-Stack Engineer, AI Developer, and Open-Source Tech Lead GitHub Profile Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <radialGradient id="glow-violet" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.22;0.32;0.22" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="82%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.18;0.28;0.18" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="50%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="border-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#6D28D9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="scanline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0" />
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#CBD5E1" stroke-width="0.6" stroke-opacity="0.25" />
    </pattern>

    <!-- Clip Paths -->
    <clipPath id="outer-clip">
      <rect x="8" y="8" width="1164" height="594" rx="22" />
    </clipPath>
    <clipPath id="ascii-clip">
      <rect x="44" y="128" width="408" height="288" rx="10" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 26px; font-weight: 700; fill: #0F172A; letter-spacing: -0.5px; }
    .subtitle { font-size: 13.5px; font-weight: 600; fill: #0891B2; letter-spacing: 0.4px; }
    .sec-hdr { font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 1.8px; }
    .lbl { font-size: 12px; font-weight: 600; fill: #64748B; text-anchor: end; }
    .val { font-size: 12.5px; font-weight: 500; fill: #0F172A; }
    .val-hi { font-size: 12.5px; font-weight: 700; fill: #0369A1; }
    .val-em { font-size: 12.5px; font-weight: 600; fill: #047857; }
    .ascii { font-size: 9.2px; fill: #0369A1; letter-spacing: 0.6px; white-space: pre; }
    .ascii-hi { font-size: 9.2px; fill: #6B21A8; letter-spacing: 0.6px; white-space: pre; }
    .pill-txt { font-size: 11px; font-weight: 600; fill: #1E293B; }
    .proj-name { font-size: 12px; font-weight: 700; fill: #0891B2; }
    .proj-desc { font-size: 11.5px; fill: #334155; }
    .nav-txt { font-size: 11.5px; fill: #475569; }
    .cmd-txt { font-size: 12px; fill: #059669; }
  </style>

  <g clip-path="url(#outer-clip)">
